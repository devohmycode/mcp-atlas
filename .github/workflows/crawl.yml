name: crawl

on:
  schedule:
    # Every other day at 04:37 UTC. A full crawl takes about an hour: the official registry is slow.
    - cron: '37 4 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Crawl every source
        run: npm run crawl
        env:
          # Repository secrets (Settings > Secrets and variables > Actions). A missing one skips its source.
          GLAMA_API_KEY: ${{ secrets.GLAMA_API_KEY }}
          PULSEMCP_API_KEY: ${{ secrets.PULSEMCP_API_KEY }}
          PULSEMCP_TENANT_ID: ${{ secrets.PULSEMCP_TENANT_ID }}
      - name: Commit the new snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json.gz
          if git diff --cached --quiet; then
            echo 'catalog unchanged'
          else
            git commit -m "chore(catalog): refresh snapshot $(date -u +%F)"
            # main may have moved during the crawl: replay the snapshot on top of it; this run's file wins.
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
              echo "push attempt $attempt failed, retrying"
              sleep $((attempt * 10))
            done
            exit 1
          fi
